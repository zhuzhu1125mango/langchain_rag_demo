# Nginx 配置：前端静态资源服务 + 反向代理后端 API。
# - / 下为 SPA 静态资源，回退到 index.html 支持前端路由
# - /api/ 反向代理到后端 FastAPI，保留 /api 前缀，并支持 WebSocket 与 SSE

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            # 末尾不带斜杠：保留 /api 前缀转发给后端，避免路径被剥离导致 404
            proxy_pass http://backend:8000;

            # 上传体积上限。nginx 默认仅 1m，而后端 MAX_UPLOAD_SIZE_MB 为 100，
            # 不设置时生产环境任何 >1MB 的文档上传都会被 nginx 直接 413 拦下
            # （返回 nginx 的 HTML 错误页，前端 JSON 错误处理会失配）。
            # 取 110m 而非 100m：本指令限制的是整个 multipart 请求体，
            # 比后端校验的文件字节数多出边界/表单字段开销，留出余量。
            client_max_body_size 110m;
            # 大文件直接透传给后端，不在 nginx 侧落盘缓冲
            proxy_request_buffering off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket 升级支持
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # SSE 关键配置：禁用缓冲/缓存，放宽读超时以支持长连接流式响应
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
        }
    }
}
