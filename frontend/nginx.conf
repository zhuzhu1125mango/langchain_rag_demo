# Nginx 配置：前端静态资源服务 + 反向代理后端 API。
# - / 下为 SPA 静态资源，回退到 index.html 支持前端路由
# - /api/ 反向代理到后端 FastAPI，保留 /api 前缀，并支持 WebSocket 与 SSE

events {
    worker_connections 1024;
}

# W6 #60：非 root 运行无法写默认 /run/nginx.pid，显式落到 /tmp
pid /tmp/nginx.pid;

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        # W6 #60：非 root 运行（nginx-unprivileged 镜像）需 >1024 端口，compose 侧 80:8080 映射
        listen 8080;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        # W6 #59：基础安全响应头
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # CSP 允许同源 + 内联样式（Element Plus/Tailwind 运行时注入 style 标签）+
        # 同源 WebSocket（上传进度通道）；SSE/静态资源均为同源
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'self'; base-uri 'self'" always;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            # 末尾不带斜杠：保留 /api 前缀转发给后端，避免路径被剥离导致 404
            proxy_pass http://backend:8000;

            # 上传体积上限。nginx 默认仅 1m，而后端 MAX_UPLOAD_SIZE_MB 为 100，
            # 不设置时生产环境任何 >1MB 的文档上传都会被 nginx 直接 413 拦下
            # （返回 nginx 的 HTML 错误页，前端 JSON 错误处理会失配）。
            # 取 110m 而非 100m：本指令限制的是整个 multipart 请求体，
            # 比后端校验的文件字节数多出边界/表单字段开销，留出余量。
            client_max_body_size 110m;
            # 大文件直接透传给后端，不在 nginx 侧落盘缓冲
            proxy_request_buffering off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket 升级支持
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # SSE 关键配置：禁用缓冲/缓存，放宽读超时以支持长连接流式响应
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
        }
    }
}
