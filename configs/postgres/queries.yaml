pg_stat_statements:
  query: "SELECT queryid, query, calls, total_exec_time, min_exec_time, max_exec_time, mean_exec_time, stddev_exec_time, rows, shared_blks_hit, shared_blks_read, shared_blks_dirtied, shared_blks_written, local_blks_hit, local_blks_read, local_blks_dirtied, local_blks_written, temp_blks_read, temp_blks_written, blk_read_time, blk_write_time FROM pg_stat_statements"
  metrics:
    - queryid:
        usage: "LABEL"
        description: "Query identifier"
    - query:
        usage: "LABEL"
        description: "Text of the query"
    - calls:
        usage: "COUNTER"
        description: "Number of times this query has been executed"
    - total_exec_time:
        usage: "COUNTER"
        description: "Total time spent in the query (ms)"
    - min_exec_time:
        usage: "GAUGE"
        description: "Minimum time spent in the query (ms)"
    - max_exec_time:
        usage: "GAUGE"
        description: "Maximum time spent in the query (ms)"
    - mean_exec_time:
        usage: "GAUGE"
        description: "Mean time spent in the query (ms)"
    - stddev_exec_time:
        usage: "GAUGE"
        description: "Standard deviation of time spent in the query (ms)"
    - rows:
        usage: "COUNTER"
        description: "Number of rows returned or affected"
    - shared_blks_hit:
        usage: "COUNTER"
        description: "Number of shared buffer hits"
    - shared_blks_read:
        usage: "COUNTER"
        description: "Number of shared blocks read"
    - shared_blks_dirtied:
        usage: "COUNTER"
        description: "Number of shared blocks dirtied"
    - shared_blks_written:
        usage: "COUNTER"
        description: "Number of shared blocks written"

pg_stat_database:
  query: "SELECT datname, numbackends, xact_commit, xact_rollback, blks_read, blks_hit, tup_returned, tup_fetched, tup_inserted, tup_updated, tup_deleted, conflicts, temp_files, temp_bytes, deadlocks FROM pg_stat_database WHERE datname = current_database()"
  metrics:
    - datname:
        usage: "LABEL"
        description: "Database name"
    - numbackends:
        usage: "GAUGE"
        description: "Number of backends connected to this database"
    - xact_commit:
        usage: "COUNTER"
        description: "Number of transactions committed"
    - xact_rollback:
        usage: "COUNTER"
        description: "Number of transactions rolled back"
    - blks_read:
        usage: "COUNTER"
        description: "Number of disk blocks read"
    - blks_hit:
        usage: "COUNTER"
        description: "Number of buffer hits"
    - tup_returned:
        usage: "COUNTER"
        description: "Number of tuples returned"
    - tup_fetched:
        usage: "COUNTER"
        description: "Number of tuples fetched"
    - tup_inserted:
        usage: "COUNTER"
        description: "Number of tuples inserted"
    - tup_updated:
        usage: "COUNTER"
        description: "Number of tuples updated"
    - tup_deleted:
        usage: "COUNTER"
        description: "Number of tuples deleted"
    - conflicts:
        usage: "COUNTER"
        description: "Number of conflicts"
    - temp_files:
        usage: "COUNTER"
        description: "Number of temporary files created"
    - temp_bytes:
        usage: "COUNTER"
        description: "Total bytes written to temporary files"
    - deadlocks:
        usage: "COUNTER"
        description: "Number of deadlocks detected"