# =============================================================================
# Grafana Dashboard provisioning
# -----------------------------------------------------------------------------
# 通过 provisioning 自动加载本地 dashboard JSON 到 Grafana，无需在 UI 手动导入。
# dashboards provider 指向挂载的 configs/grafana/dashboards 目录。
# =============================================================================

apiVersion: 1

providers:
  - name: 'RAG'
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false