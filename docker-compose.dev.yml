# =============================================================================
# 开发环境 Docker Compose 配置
# -----------------------------------------------------------------------------
# 用途：本地开发使用，包含 RAG 系统所有必需服务：
#   - MinIO          对象存储，存放上传的文档
#   - Milvus         向量数据库，存储文档向量
#   - etcd           Milvus 的元数据存储
#   - PostgreSQL     关系型数据库，存放业务数据
#   - Redis          缓存
#   - SearXNG        元搜索引擎，提供 Web 搜索能力
#   - Prometheus     监控指标采集
#   - Grafana        监控可视化
#   - postgres-exporter  PostgreSQL 指标导出
# 前端使用 Vite dev server（热更新），后端代码挂载到容器支持热重载。
# 使用方式：docker compose -f docker-compose.dev.yml up -d
# =============================================================================

services:
  # redis — 缓存服务，用于会话/搜索结果/向量缓存
  redis:
    image: redis:7.2-alpine
    container_name: redis-dev
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data_dev:/data
    networks:
      - monitoring
    restart: no
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # searxng — 元搜索引擎，聚合多个搜索源供 RAG 检索增强使用
  searxng:
    image: searxng/searxng:latest
    container_name: searxng-dev
    networks:
      - monitoring
    restart: no
    ports:
      - "8080:8080"
    volumes:
      - ./configs/searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_SETTINGS_PATH=/etc/searxng/settings.yml
      - SEARXNG_SECRET_KEY=${SEARXNG_SECRET_KEY}  # SearXNG 会话加密密钥
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # postgres — 关系型数据库，存放知识库/会话/实验等业务数据
  postgres:
    image: postgres:16.14
    container_name: postgres-dev
    environment:
      POSTGRES_DB: ${POSTGRES_DB}                      # 初始化数据库名
      POSTGRES_USER: ${POSTGRES_USER}                  # 数据库用户名
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}          # 数据库密码
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      LANG: en_US.utf8
      LC_ALL: C.UTF-8
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ./configs/postgres/init-pg-stat-statements.sh:/docker-entrypoint-initdb.d/init-pg-stat-statements.sh
    networks:
      - monitoring
    restart: no
    ports:
      - "5433:5432"                                    # 宿主机 5433 避免与本地 PG 冲突
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "pg_stat_statements.track=all", "-c", "client_encoding=UTF8", "-c", "listen_addresses=*"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # minio — 对象存储，存放上传的原始文档与文件
  minio:
    image: minio/minio:latest
    container_name: minio-dev
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}              # MinIO 管理员账号
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}      # MinIO 管理员密码
    volumes:
      - minio_data_dev:/minio_data
    networks:
      - monitoring
    restart: no
    command: minio server /minio_data --console-address ":9001"
    ports:
      - "9000:9000"                                    # S3 API 端口
      - "9001:9001"                                    # 管理控制台端口
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # etcd — Milvus 的元数据存储（键值对数据库）
  etcd:
    image: quay.io/coreos/etcd:v3.5.30
    container_name: etcd-dev
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
    volumes:
      - etcd_data_dev:/etcd
    networks:
      - monitoring
    restart: no
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://localhost:2379", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # milvus-standalone — 向量数据库，存储并检索文档向量
  milvus-standalone:
    image: milvusdb/milvus:v2.6.17
    container_name: milvus-standalone-dev
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER}          # 复用 MinIO 管理员账号
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}  # 复用 MinIO 管理员密码
      # 开发环境同样放宽单集合 flush 限流，避免批量删除触发 rate limit。
      # 客户端保留令牌桶限速 + 指数退避兜底。
      MILVUS_QUOTAANDLIMITS_FLUSH_ENABLE: "true"
      MILVUS_QUOTAANDLIMITS_FLUSH_COLLECTIONRATE_MAX: "2.0"
    volumes:
      - milvus_data_dev:/var/lib/milvus
    networks:
      - monitoring
    restart: no
    ports:
      - "19530:19530"                                  # Milvus gRPC 端口
      - "9091:9091"                                    # Milvus 健康检查/指标端口
    depends_on:
      etcd:
        condition: service_started
      minio:
        condition: service_healthy

  # backend — 后端 API 服务（开发模式，源码挂载支持热重载）
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: backend-dev
    environment:
      IN_DOCKER: "true"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}            # 业务访问 MinIO 的 key
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}            # 业务访问 MinIO 的 secret
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME}          # 文档存储 bucket
      MINIO_SECURE: "false"                            # 开发环境关闭 HTTPS
      MILVUS_HOST: milvus-standalone
      MILVUS_PORT: 19530
      MILVUS_DATABASE: ${MILVUS_DATABASE}              # Milvus 数据库实例
      MILVUS_COLLECTION_NAME: ${MILVUS_COLLECTION_NAME}  # 向量集合名
      MILVUS_INDEX_NAME: ${MILVUS_INDEX_NAME}          # 向量索引名
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: ${REDIS_DB}                            # Redis 逻辑库编号
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      OLLAMA_MODEL_NAME: ${OLLAMA_MODEL_NAME}          # 对话使用的大模型
      OLLAMA_DIRECT_MODEL_NAME: ${OLLAMA_DIRECT_MODEL_NAME}  # 深度思考关闭时的非思考专用模型
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME}    # 向量化使用的模型
      SKIP_OLLAMA_CHECK: "true"
      OLLAMA_HOST: host.docker.internal                # 通过宿主机访问本地 Ollama
      HF_HOME: /app/data/model_cache/huggingface       # HF 模型缓存（挂载卷，离线可用）
      HF_HUB_OFFLINE: "1"                              # 容器无法访问 huggingface.co，强制离线用缓存
      TRANSFORMERS_OFFLINE: "1"
      CHUNK_SIZE: ${CHUNK_SIZE}                        # 文档分块大小
      CHUNK_OVERLAP: ${CHUNK_OVERLAP}                  # 文档分块重叠字符数
      TOP_K: ${TOP_K}                                  # 检索召回数量
      SEARCH_PROVIDER: ${SEARCH_PROVIDER}              # 搜索引擎提供方（searxng/tavily 等）
      SEARXNG_BASE_URL: http://searxng:8080
      SEARXNG_TIMEOUT: ${SEARXNG_TIMEOUT}
      SEARCH_MAX_RESULTS: ${SEARCH_MAX_RESULTS}
      SEARCH_FETCH_TIMEOUT: ${SEARCH_FETCH_TIMEOUT}
      SEARCH_MAX_FETCH: ${SEARCH_MAX_FETCH}
      SEARCH_MIN_CONTENT_LENGTH: ${SEARCH_MIN_CONTENT_LENGTH}
      SEARCH_ENABLE_MULTI_QUERY: ${SEARCH_ENABLE_MULTI_QUERY}
      SEARCH_NUM_QUERIES: ${SEARCH_NUM_QUERIES}
      SEARCH_ENABLE_RERANK: ${SEARCH_ENABLE_RERANK}
      SEARCH_RERANK_MODEL: ${SEARCH_RERANK_MODEL}
      SEARCH_RERANK_PROVIDER: ${SEARCH_RERANK_PROVIDER}   # 重排模型加载方式
      SEARCH_RERANK_TOP_K: ${SEARCH_RERANK_TOP_K}
      KB_RERANK_MODEL: ${KB_RERANK_MODEL}                 # 知识库重排序模型
      KB_RERANK_PROVIDER: ${KB_RERANK_PROVIDER}           # 知识库重排模型加载方式
      SEARCH_CACHE_TTL: ${SEARCH_CACHE_TTL}
      SEARCH_CONTENT_CACHE_TTL: ${SEARCH_CONTENT_CACHE_TTL}
      SEARCH_ENABLE_FUNCTION_CALLING: ${SEARCH_ENABLE_FUNCTION_CALLING}
      SEARCH_ENABLE_REACT: ${SEARCH_ENABLE_REACT}
      SEARCH_REACT_MAX_STEPS: ${SEARCH_REACT_MAX_STEPS}
      SEARCH_AGENT_FALLBACK_TO_PHASE2: ${SEARCH_AGENT_FALLBACK_TO_PHASE2}
      TITLE_GENERATION_ENABLED: ${TITLE_GENERATION_ENABLED}
      TITLE_MAX_LENGTH: ${TITLE_MAX_LENGTH}
      TITLE_FALLBACK_LENGTH: ${TITLE_FALLBACK_LENGTH}
      TITLE_GENERATION_MODEL: ${TITLE_GENERATION_MODEL}
      SECRET_KEY: ${SECRET_KEY}                        # 应用签名密钥（JWT/Session）
      SEMANTIC_CACHE_ENABLED: ${SEMANTIC_CACHE_ENABLED}                      # P1-3 语义缓存总开关
      SEMANTIC_CACHE_SIMILARITY_THRESHOLD: ${SEMANTIC_CACHE_SIMILARITY_THRESHOLD}  # 语义命中相似度阈值
      SEMANTIC_CACHE_TTL_HOURS: ${SEMANTIC_CACHE_TTL_HOURS}                  # 条目过期时间（小时）
      SEMANTIC_CACHE_MAX_ENTRIES: ${SEMANTIC_CACHE_MAX_ENTRIES}              # 单范围条目上限
      SEMANTIC_CACHE_REPLAY_CHUNK_CHARS: ${SEMANTIC_CACHE_REPLAY_CHUNK_CHARS}  # 命中回放切片长度
    volumes:
      - ./backend:/app
      - /app/.venv                                       # 匿名卷防止宿主机 Windows .venv 覆盖容器内 Linux venv
      - ./backend/data:/app/data
      - ./backend/logs:/app/logs
    networks:
      - monitoring
    restart: no
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      milvus-standalone:
        condition: service_started
      redis:
        condition: service_healthy
      searxng:
        condition: service_started
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # frontend — 前端开发服务，使用 Vite dev server 提供热更新
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: frontend-dev
    volumes:
      - ./frontend:/app
      - /app/node_modules                               # 防止宿主机的 node_modules 覆盖容器内
    networks:
      - monitoring
    restart: no
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://backend:8000          # 前端请求后端的地址

  # prometheus — 指标采集与存储
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: prometheus-dev
    ports:
      - "9090:9090"
    volumes:
      - ./configs/prometheus/prometheus.dev.yml:/etc/prometheus/prometheus.yml
      - ./configs/prometheus/alerts.yml:/etc/prometheus/alerts.yml
      - prometheus_data_dev:/prometheus
    networks:
      - monitoring
    restart: no
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'                        # 启用热重载 API

  # grafana — 监控可视化面板
  grafana:
    image: grafana/grafana:12.0.2
    container_name: grafana-dev
    ports:
      - "3000:3000"
    volumes:
      - ./configs/grafana/datasources:/etc/grafana/provisioning/datasources
      - grafana_data_dev:/var/lib/grafana
    networks:
      - monitoring
    restart: no
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}  # Grafana 管理员密码

  # postgres-exporter — 将 PostgreSQL 指标导出给 Prometheus
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter-dev
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
    volumes:
      - ./configs/postgres/queries.yaml:/etc/postgres_exporter/queries.yaml
    networks:
      - monitoring
    restart: no
    depends_on:
      postgres:
        condition: service_healthy

# 持久化卷：所有服务的数据卷以 _dev 后缀区分开发环境
volumes:
  postgres_data_dev:
  minio_data_dev:
  redis_data_dev:
  etcd_data_dev:
  milvus_data_dev:
  prometheus_data_dev:
  grafana_data_dev:

# 网络：所有服务共用 monitoring 桥接网络
networks:
  monitoring:
    driver: bridge
