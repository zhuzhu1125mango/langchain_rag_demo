# =============================================================================
# 生产环境 Docker Compose 配置
# -----------------------------------------------------------------------------
# 用途：生产部署使用，包含 RAG 系统全部服务：
#   - MinIO / Milvus / etcd / PostgreSQL / Redis  基础设施
#   - backend   后端 API（使用 Dockerfile.prod 多阶段构建）
#   - frontend  前端（nginx 静态托管构建产物）
#   - Prometheus / Alertmanager / Grafana / postgres-exporter  监控告警栈
# 所有服务默认 restart: unless-stopped，确保异常退出后自动恢复。
# 使用方式：docker compose -f docker-compose.yml --env-file .env.prod up -d
# ⚠️ 说明：直接 up -d 只会拉起服务，不会执行数据库迁移（alembic）。请使用
#    ./scripts/start-prod.sh 启动（重启 backend 前会自动 exec alembic upgrade head /
#    stamp head 对齐 schema），或在重启 backend 后手动执行
#    docker compose -f docker-compose.yml --env-file .env.prod exec backend alembic upgrade head。
# 隔离说明：project name 固定为 rag-prod，与开发栈（rag-dev）容器/卷/网络完全隔离，可并存；
#           宿主机端口与开发栈全部错开（backend 8001 / postgres 5434 / redis 6380 /
#           minio 9002-9003 / milvus 19531 / prometheus 9094 /
#           grafana 3001 / alertmanager 9095），基础设施端口仅绑定回环地址。
# =============================================================================

name: rag-prod

# =============================================================================
# Docker Secrets（W2-11）：凭据不再以明文存在于 .env.prod / compose 插值，
# 改由宿主机 ./secrets/ 目录下的文件挂载到容器 /run/secrets/。
# 生成方式：./scripts/gen_secrets.ps1（或 -FromEnv .env.prod 导出存量值）
# 明细与字段映射见 docs/guide/deployment.md「Docker Secrets」章节。
# =============================================================================
secrets:
  POSTGRES_PASSWORD:
    file: ./secrets/postgres_password
  MINIO_ROOT_USER:
    file: ./secrets/minio_root_user
  MINIO_ROOT_PASSWORD:
    file: ./secrets/minio_root_password
  # backend 字段名为 MINIO_ACCESS_KEY / MINIO_SECRET_KEY，secret 名与字段对齐，
  # file 指向同一源文件（值与 minio root 一致）
  MINIO_ACCESS_KEY:
    file: ./secrets/minio_root_user
  MINIO_SECRET_KEY:
    file: ./secrets/minio_root_password
  REDIS_PASSWORD:
    file: ./secrets/redis_password
  SECRET_KEY:
    file: ./secrets/secret_key
  ADMIN_KEY:
    file: ./secrets/admin_key
  SEARCH_API_KEY:
    file: ./secrets/search_api_key
  METRICS_TOKEN:
    file: ./secrets/metrics_token
  GRAFANA_ADMIN_PASSWORD:
    file: ./secrets/grafana_admin_password

services:
  # redis — 缓存服务，用于会话/搜索结果/向量缓存
  redis:
    image: redis:7.2-alpine
    container_name: redis-prod
    # 密码经 secrets 注入（redis-server 无 *_FILE 原生支持，shell 运行时读取）
    command: sh -c 'redis-server --requirepass "$$(cat /run/secrets/REDIS_PASSWORD)"'
    volumes:
      - redis_data_prod:/data
    networks:
      - monitoring
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    ports:
      - "127.0.0.1:6380:6379"      # 与开发栈（6379）错开；仅绑定回环地址，避免基础设施端口暴露到外部网络
    secrets:
      - REDIS_PASSWORD
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$(cat /run/secrets/REDIS_PASSWORD)\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  # backend — 后端 API 服务（生产镜像，构建产物精简）
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: backend-prod
    # 全量业务配置由 env 文件注入；新增功能开关只改 env 文件，不再改本文件
    env_file:
      - .env.prod
    environment:          # 仅保留 docker 网络路由覆盖（优先级高于 env_file）
      APP_ENV: "prod"                  # 显式 prod：不依赖 IN_DOCKER 回退判定生产
      IN_DOCKER: "true"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      MINIO_ENDPOINT: minio:9000
      MINIO_SECURE: "false"                 # MinIO 容器为明文 HTTP，覆盖 .env.prod 的 MINIO_SECURE=true 避免上传 500
      MILVUS_HOST: milvus-standalone
      MILVUS_PORT: "19530"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      OLLAMA_HOST: host.docker.internal                # 通过宿主机访问 Ollama
      SKIP_OLLAMA_CHECK: "true"
      NLTK_DATA: /app/data/nltk_data                   # nltk 语料离线目录（BM25 中文分词依赖 stopwords）
      HF_HOME: /app/data/model_cache/huggingface       # HF 模型缓存（挂载卷，离线可用）
      HF_HUB_OFFLINE: "1"                              # 容器内强制离线用缓存
      TRANSFORMERS_OFFLINE: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"            # Linux 宿主机上该 DNS 名默认不存在，显式映射到网关
    volumes:
      - ./backend/data:/app/data
    networks:
      - monitoring
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
    # 凭据经 secrets 挂载到 /run/secrets/，pydantic-settings secrets_dir 按字段名读取
    # （POSTGRES_PASSWORD / MINIO_ACCESS_KEY / MINIO_SECRET_KEY / REDIS_PASSWORD /
    #  SECRET_KEY / ADMIN_KEY / SEARCH_API_KEY / METRICS_TOKEN），优先级高于 env_file
    secrets:
      - POSTGRES_PASSWORD
      - MINIO_ACCESS_KEY
      - MINIO_SECRET_KEY
      - REDIS_PASSWORD
      - SECRET_KEY
      - ADMIN_KEY
      - SEARCH_API_KEY
      - METRICS_TOKEN
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      milvus-standalone:
        condition: service_started
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8001:8000"      # 与开发栈（8000）错开；仅绑定回环地址，容器内仍为 8000

  # frontend — 前端生产服务，nginx 托管构建后的静态文件
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: frontend-prod
    networks:
      - monitoring
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"                                        # nginx 默认 HTTP 端口

  # prometheus — 指标采集与存储
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: prometheus-prod
    ports:
      - "127.0.0.1:9094:9090"      # 与开发栈（9090）错开；仅绑定回环地址，避免基础设施端口暴露到外部网络
    volumes:
      - ./configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./configs/prometheus/alerts.yml:/etc/prometheus/alerts.yml
      - prometheus_data_prod:/prometheus
    networks:
      - monitoring
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    # /metrics 抓取令牌（W2-12）：fastapi-app job 经 credentials_file 携带
    secrets:
      - METRICS_TOKEN
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      # 移除 --web.enable-lifecycle：该开关允许无鉴权远程触发热重载，
      # 如需热重载请在宿主机上执行 docker compose exec prometheus kill -HUP 1

  # alertmanager — 告警路由与分发（邮件/webhook 等）
  alertmanager:
    image: prom/alertmanager:v0.29.0
    container_name: alertmanager-prod
    ports:
      - "127.0.0.1:9095:9093"      # 与开发栈错开；仅绑定回环地址，避免基础设施端口暴露到外部网络
    volumes:
      - ./configs/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager_data_prod:/alertmanager
    networks:
      - monitoring
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9093/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # grafana — 监控可视化面板
  grafana:
    image: grafana/grafana:12.0.2
    container_name: grafana-prod
    ports:
      - "127.0.0.1:3001:3000"      # 与开发栈（3000）错开；仅绑定回环地址（远程访问请走 SSH 隧道或反向代理）
    volumes:
      - ./configs/grafana/datasources:/etc/grafana/provisioning/datasources
      - ./configs/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./configs/grafana/dashboards:/var/lib/grafana/dashboards
      - grafana_data_prod:/var/lib/grafana
    networks:
      - monitoring
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/GRAFANA_ADMIN_PASSWORD  # 密码经 secrets 注入（grafana 原生 __FILE 支持）
      - GF_USERS_ALLOW_SIGN_UP=false                              # 生产环境禁用自助注册
    secrets:
      - GRAFANA_ADMIN_PASSWORD
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # etcd — Milvus 的元数据存储（键值对数据库）
  etcd:
    image: quay.io/coreos/etcd:v3.5.30
    container_name: etcd-prod
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
    volumes:
      - etcd_data_prod:/etcd
    networks:
      - monitoring
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://localhost:2379", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # minio — 对象存储，存放上传的原始文档与文件
  minio:
    image: pgsty/minio:RELEASE.2026-06-18T00-00-00Z   # 社区 fork（MinIO 官方 2025-10 停发镜像并归档仓库，原 minio/minio 冻结 tag 已从 Docker Hub 下架无法拉取；pgsty/minio 为 drop-in 兼容、仍在维护）
    container_name: minio-prod
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/MINIO_ROOT_USER       # 凭据经 secrets 注入（原生 *_FILE 支持）
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/MINIO_ROOT_PASSWORD
    volumes:
      - minio_data_prod:/minio_data
    networks:
      - monitoring
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    command: minio server /minio_data --console-address ":9001"
    ports:
      - "127.0.0.1:9002:9000"      # S3 API 端口，与开发栈（9000）错开；仅绑定回环地址（后端经 docker 网络访问 minio:9000，不受影响）
      - "127.0.0.1:9003:9001"      # 管理控制台端口，与开发栈（9001）错开；仅绑定回环地址
    secrets:
      - MINIO_ROOT_USER
      - MINIO_ROOT_PASSWORD
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # milvus-standalone — 向量数据库，存储并检索文档向量
  milvus-standalone:
    image: milvusdb/milvus:v2.6.17
    container_name: milvus-standalone-prod
    command:
      - /bin/sh
      - -c
      - 'export MINIO_ACCESS_KEY_ID="$$(cat /run/secrets/MINIO_ROOT_USER)" MINIO_SECRET_ACCESS_KEY="$$(cat /run/secrets/MINIO_ROOT_PASSWORD)"; exec milvus run standalone'
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      # 调整单集合 flush 限流阈值。Milvus 默认对单集合 flush 限流 0.1 QPS，
      # 批量删除等高频 flush 场景会触发 rate limit。此处放宽到 2.0 QPS，
      # 仍远低于正常刷盘能力，但可显著降低批量操作耗时。
      # 客户端仍保留 0.15 QPS 的令牌桶限速 + 指数退避作为兜底保护。
      MILVUS_QUOTAANDLIMITS_FLUSH_ENABLE: "true"
      MILVUS_QUOTAANDLIMITS_FLUSH_COLLECTIONRATE_MAX: "2.0"
    volumes:
      - milvus_data_prod:/var/lib/milvus
    networks:
      - monitoring
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
    ports:
      - "127.0.0.1:19531:19530"    # Milvus gRPC 端口，与开发栈（19530）错开；仅绑定回环地址（后端经 docker 网络访问，不受影响）
      - "127.0.0.1:9092:9091"      # 健康检查/指标端口，与开发栈（9091）错开；仅绑定回环地址
    secrets:
      - MINIO_ROOT_USER
      - MINIO_ROOT_PASSWORD
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    depends_on:
      etcd:
        condition: service_started
      minio:
        condition: service_healthy

  # postgres — 关系型数据库，存放知识库/会话/实验等业务数据
  postgres:
    image: postgres:16.14
    container_name: postgres-prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB}                      # 初始化数据库名
      POSTGRES_USER: ${POSTGRES_USER}                  # 数据库用户名
      POSTGRES_PASSWORD_FILE: /run/secrets/POSTGRES_PASSWORD   # 密码经 secrets 注入（官方镜像原生支持）
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      LANG: en_US.utf8
      LC_ALL: C.UTF-8
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./configs/postgres/init-pg-stat-statements.sh:/docker-entrypoint-initdb.d/init-pg-stat-statements.sh
    networks:
      - monitoring
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    ports:
      - "127.0.0.1:5434:5432"      # 与开发栈（5433）错开；仅绑定回环地址，避免基础设施端口暴露到外部网络
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "pg_stat_statements.track=all", "-c", "client_encoding=UTF8", "-c", "listen_addresses=*"]
    secrets:
      - POSTGRES_PASSWORD
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # postgres-exporter — 将 PostgreSQL 指标导出给 Prometheus
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1   # 固定版本 tag，避免 latest 漂移
    container_name: postgres-exporter-prod
    # DATA_SOURCE_NAME 无 *_FILE 原生支持：覆盖 entrypoint，运行时拼接
    # 连接串（user/db 为非敏感值仍走 env 插值，密码从 secrets 读取）
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'export DATA_SOURCE_NAME="postgresql://${POSTGRES_USER}:$$(cat /run/secrets/POSTGRES_PASSWORD)@postgres:5432/${POSTGRES_DB}?sslmode=disable"; exec /bin/postgres_exporter --extend.query-path=/etc/postgres_exporter/queries.yaml'
    environment:
      PG_EXPORTER_DISABLE_DEFAULT_METRICS: "false"
    volumes:
      - ./configs/postgres/queries.yaml:/etc/postgres_exporter/queries.yaml
    networks:
      - monitoring
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
    secrets:
      - POSTGRES_PASSWORD
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9187/metrics"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy

# 持久化卷：所有服务的数据卷以 _prod 后缀区分生产环境
volumes:
  prometheus_data_prod:
  alertmanager_data_prod:
  grafana_data_prod:
  etcd_data_prod:
  minio_data_prod:
  milvus_data_prod:
  postgres_data_prod:
  redis_data_prod:

# 网络：所有服务共用 monitoring 桥接网络
networks:
  monitoring:
    driver: bridge
