# =============================================================================
# CI：后端单测 / 后端集成测试（服务容器）/ 前端构建
# -----------------------------------------------------------------------------
# - backend-unit:        纯单测，默认跳过 integration/e2e 标记，无需外部服务
# - backend-integration: services 挂起 PostgreSQL（默认 CMD 正常）；
#                        Redis/etcd/MinIO/Milvus 以 docker run 步骤手动启动
#                        （redis 需 --requirepass，其余三者镜像默认 CMD 不满足
#                        services 要求，见正文注释），
#                        运行 `pytest --run-integration`
# - frontend:            pnpm 安装 + 类型检查构建，保证前端可编译
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-unit:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        # 注意：setup-uv 自 v9 起无 v10/v9 主版本别名 tag，只能用完整版本 tag
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      # 默认即跳过 integration / e2e 标记（conftest.py 控制），CI 无需外部服务
      - name: Run unit tests
        run: uv run pytest -q

  backend-integration:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16.14
        env:
          POSTGRES_USER: rag_ci
          POSTGRES_PASSWORD: rag_ci_password
          POSTGRES_DB: rag_ci_db
          POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag_ci -d rag_ci_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    # redis 也手动启动：CacheService 硬性要求 REDIS_PASSWORD（P2 安全加固），
    # 而 GHA services 语法无法给 redis-server 追加 --requirepass 参数。

    # minio / etcd / milvus 均不能作为 GHA service 运行（services 语法无法传
    # 容器启动参数，仅 image/env/ports/volumes/options）：
    # - minio 镜像 CMD 仅为 "minio"，缺 "server /data" 参数会打印 usage 并退出
    #   （已用 registry API 核实：Entrypoint=/usr/bin/docker-entrypoint.sh, Cmd=minio）
    # - etcd 默认只监听 localhost:2379，需显式 0.0.0.0 才能被其他容器访问
    # - milvus 镜像仅有 ENTRYPOINT /tini，无默认 CMD（PR #47527 未合并）
    # 三者统一在 "Start storage services" 步骤手动 docker run 于自建网络。

    env:
      # 与 services 容器对齐（pydantic-settings 直接读环境变量，优先级高于 .env 文件）
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: rag_ci
      POSTGRES_PASSWORD: rag_ci_password
      POSTGRES_DB: rag_ci_db
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      REDIS_PASSWORD: rag_ci_password
      MINIO_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: rag_ci_minio
      MINIO_SECRET_KEY: rag_ci_minio_password
      MINIO_BUCKET_NAME: documents
      MILVUS_HOST: localhost
      MILVUS_PORT: "19530"
      # 应用启动时 Ollama 未就绪属预期：预热为 best-effort，连接失败仅告警不阻塞
      OLLAMA_HOST: http://localhost:11434

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        # 注意：setup-uv 自 v9 起无 v10/v9 主版本别名 tag，只能用完整版本 tag
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      # Redis / etcd / MinIO / Milvus 手动启动（原因见 services 下方注释），自建网络互访；
      # 端口映射到宿主机供 pytest 连接：redis(6379)、minio(9000)、milvus(19530/9091)
      - name: Start storage services
        run: |
          docker network create rag-ci
          docker run -d --name redis --network rag-ci \
            -p 6379:6379 \
            redis:7.2-alpine \
            redis-server --requirepass rag_ci_password
          docker run -d --name etcd --network rag-ci \
            quay.io/coreos/etcd:v3.5.30 \
            etcd -advertise-client-urls=http://etcd:2379 \
                 -listen-client-urls=http://0.0.0.0:2379 \
                 --data-dir /etcd \
                 --auto-compaction-retention=1h \
                 --auto-compaction-mode=periodic \
                 --snapshot-count=10000
          docker run -d --name minio --network rag-ci \
            -e MINIO_ROOT_USER=rag_ci_minio \
            -e MINIO_ROOT_PASSWORD=rag_ci_minio_password \
            -p 9000:9000 \
            minio/minio:RELEASE.2025-09-07T16-13-09Z \
            server /data --console-address ":9001"
          docker run -d --name milvus --network rag-ci \
            -e ETCD_ENDPOINTS=etcd:2379 \
            -e MINIO_ADDRESS=minio:9000 \
            -e MINIO_ACCESS_KEY_ID=rag_ci_minio \
            -e MINIO_SECRET_ACCESS_KEY=rag_ci_minio_password \
            -p 19530:19530 -p 9091:9091 \
            milvusdb/milvus:v2.6.17 milvus run standalone

      # 轮询四个服务就绪；失败时输出容器日志便于排查
      - name: Wait for storage services
        run: |
          for i in $(seq 1 60); do
            ok=1
            docker exec redis redis-cli -a rag_ci_password ping >/dev/null 2>&1 || ok=0
            docker exec etcd etcdctl --endpoints=http://localhost:2379 endpoint health >/dev/null 2>&1 || ok=0
            curl -sf http://localhost:9000/minio/health/live >/dev/null 2>&1 || ok=0
            curl -sf http://localhost:9091/healthz >/dev/null 2>&1 || ok=0
            if [ $ok -eq 1 ]; then
              echo "All storage services ready after $((i * 5))s"
              exit 0
            fi
            sleep 5
          done
          echo "--- etcd logs ---"; docker logs etcd 2>&1 | tail -n 30
          echo "--- minio logs ---"; docker logs minio 2>&1 | tail -n 30
          echo "--- milvus logs ---"; docker logs milvus 2>&1 | tail -n 100
          exit 1

      - name: Run integration tests
        run: uv run pytest --run-integration -q

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # build 脚本本身包含 vue-tsc -b 类型检查
      - name: Build
        run: pnpm build
