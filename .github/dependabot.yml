version: 2
updates:
  # 用 uv 而不是 pip：项目由 uv 管理（backend/uv.lock，version 1 revision 3，
  # 本地 uv 0.11.26）。pip 生态**不认识 uv.lock**，只会改 pyproject.toml，
  # 于是每个 PR 到 CI 都变成「锁过期 → 重新解析 → 失败」。
  # 2026-11-14 复盘：7 个存量 PR 里 5 个因此全红（#34 #35 #38 #36 #31），
  # 其中 #34 的报错 `langchain-text-splitters==1.1.3 depends on langchain-core>=1.4.7
  # and your project depends on langchain-core==1.4.1` 已本地复现，与平台无关。
  # 改用 uv 生态后由 dependabot 自己重算通用锁（uv 生态自 v0.11 起支持）。
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # minor+patch 必须在同一组：2026-10-27 复盘发现拆组会导致组内组合不兼容
      # （如 trafilatura 2.3.1 要求 lxml>=6.1.3，而 lxml 补丁被分到另一组）。
      # 仍排除核心框架，避免 47 项跨框架大杂烩（#18）；被排除项按单包 PR 逐个评审。
      backend-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
        exclude-patterns:
          - "fastapi"
          - "uvicorn"
          - "sqlalchemy"
          - "alembic"
          - "langchain*"
          - "pymilvus*"
          - "pandas"
          - "unstructured"
          - "sentence-transformers"
    ignore:
      # OPS-2 收口（2026-10-27）：以下依赖被上游硬约束锁死，登记豁免避免重复 PR。
      # filelock 4.x 需 unstructured 放宽 <4.0.0（见 .trivyignore 与 pyproject 注释）；
      # transformers 5.x 与 ocr-mineru 组（mineru<5）冲突；
      # tokenizers >0.23.0 与 transformers 4.57.x（要求 <=0.23.0）冲突，后者被 mineru 锁定。
      # 解除前请先验证 `uv lock` 可解析（含 ocr-mineru extra）。
      - dependency-name: "filelock"
        update-types: ["version-update:semver-major"]
      - dependency-name: "transformers"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tokenizers"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      # sentence-transformers 6.x 要求 transformers>=5,<6；mineru 4.x 也要求 transformers 5.x 且
      # 依赖 gradio>=6.8（与主依赖冲突）。二者与 OCR 组绑定，待 OCR 组升级方案定稿后一起评估。
      - dependency-name: "sentence-transformers"
        update-types: ["version-update:semver-major"]
      - dependency-name: "mineru"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # 大版本需人工评估（已关闭的 15.x/26.x PR 不再重复打扰）；解除 ignore 后手动升级。
      - dependency-name: "markdown-it"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vueuse/core"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pinia"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
