[project]
name = "rag-backend"
version = "0.1.0"
description = "RAG Knowledge Base QA System Backend"
authors = [{ name = "Developer", email = "dev@example.com" }]
requires-python = ">=3.12,<3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "python-multipart==0.0.32",
    "PyYAML>=6.0.2,<7",
    "click==8.5.0",
    "colorama==0.4.6",
    "SQLAlchemy==2.1.6",
    "psycopg2-binary==2.9.13",
    "asyncpg==0.32.0",
    "alembic==1.20.1",
    "langchain==1.4.7",
    "langchain-community==0.4.2",
    "langchain-core==1.7.0",
    "langchain-text-splitters==1.1.3",
    "langchain-ollama==1.1.0",
    "langsmith==0.14.12",
    "pymilvus==3.0.2",
    "pymilvus-model==0.3.4",
    "minio==7.2.20",
    "pypdf==6.21.2",
    "python-docx==1.2.0",
    "openpyxl==3.1.5",
    "python-pptx==1.0.2",
    "pdfminer.six==20260107",
    "beautifulsoup4==4.15.0",
    "lxml==6.1.3",
    "trafilatura==2.3.1",
    "markdown==3.11.2",
    "unstructured==0.27.34",
    # Windows 本地开发：python-magic 0.4.27 在无 libmagic 的 Windows 上
    # import 即永久挂死（magic/compat.py 加载 magic DB 阶段；unstructured
    # 的 ImportError 兜底拦不住挂死），导致 Word 解析与全量测试卡死。
    # 用自带 libmagic 二进制的 python-magic-bin 替代（两者都提供 magic 包，
    # 经下方 tool.uv.override-dependencies 在 Windows 上互斥）；Linux 容器
    # 仍用 python-magic（系统 libmagic），行为不变。
    "python-magic-bin>=0.4.14 ; sys_platform == 'win32'",
    "ollama==0.6.3",
    "sentence-transformers==5.6.0",
    # torch 原为 sentence-transformers 的传递依赖；提升为直接依赖是因为
    # uv 对「按平台切换 index」(tool.uv.sources + marker) 仅对直接依赖生效：
    # 声明后 Linux 容器走 pytorch-cpu 源（避免拉取 ~2.5GB CUDA 依赖），
    # Windows/macOS 仍走默认镜像源（其 wheel 本身不含 CUDA）
    "torch>=2.13",
    "httpx==0.28.1",
    "httpx-sse==0.4.3",
    "aiohttp==3.14.5",
    "requests==2.34.2",
    "websockets==15.0.1",
    "prometheus-client==0.26.0",
    "prometheus-fastapi-instrumentator==8.1.0",
    "redis==8.1.0",
    "aiolimiter==1.3.0",
    "tenacity==9.2.1",
    "backoff==2.2.1",
    "aiofiles==25.1.0",
    "cachetools==7.2.4",
    "python-dateutil==2.9.0.post0",
    "pytz==2026.5",
    "certifi==2026.10.23",
    "charset-normalizer==3.5.2",
    # OPS-6：filelock 4.x 修复 CVE-2026-112940，但 unstructured（含最新 0.27.x）
    # 强制 filelock<4.0.0，暂维持 3.29.1 并在 .trivyignore 登记该条，待上游放宽后升级
    "filelock==3.29.1",
    "fsspec==2026.9.0",
    "huggingface_hub>=0.34.0,<2.0",
    "safetensors==0.8.0",
    "tokenizers==0.23.3",
    "jieba==0.42.1",
    "nltk==3.10.4",
    "cryptography==50.0.2",
    # OPS-6：以下两项为传递依赖，提升为直接依赖以固定修复版本（Trivy HIGH/CRITICAL）。
    # transformers 无法固定到 5.x：可选 ocr-mineru 组的 mineru（含 4.x）强制 <5 且依赖
    # gradio>=6.8 与主依赖冲突，故 4.x 的 3 条 CVE 在 .trivyignore 登记并限制加载来源。
    "pillow>=13.0.0",
    "urllib3>=2.8.0",
    "grpcio==1.84.1",
    "protobuf==7.36.2",
    "rich==15.0.0",
    "markdown-it-py==4.2.0",
    "Pygments==2.21.0",
    "typer==0.27.3",
    "tqdm==4.70.1",
    "pandas==3.1.0",
    "joblib==1.6.0",
    "packaging==26.3",
    "dataclasses-json==0.6.7",
    "marshmallow==3.26.2",
    "duckduckgo-search==8.1.1",
    # P1-1 JWT 多用户认证（OPS-6：2.14 修复公钥/空 HMAC Key 认证绕过）
    "pyjwt>=2.14,<3",
    "bcrypt>=4.0,<5",
    "tavily>=1.1.0",
    "langchain-openai>=1.2.2",
]

[project.scripts]
start = "start:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "pytest-mock==3.17.0",
    "black==26.10.1",
    "isort==8.0.1",
    "flake8==7.4.1",
    "pytest-timeout>=2.4.0",
]
demo = [
    "gradio",
    "gradio-client",
]
# P0-2b OCR 深度解析可选依赖组（重依赖，默认不安装，CI 不装）：
#   uv sync --group ocr-mineru   # MinerU pipeline 后端（torch，约 2GB）
#   uv sync --group ocr-paddle   # PaddleOCR PP-StructureV3（paddlepaddle，约 1GB）
# 未安装时 OCR 分流自动回退内置 PyPDF 解析，不影响其他功能。
ocr-mineru = [
    # 用 [pipeline] 而非 [core]：[core] 附带 gradio（要求 aiofiles<25），与主依赖冲突
    # >=3.2.0：3.1.x 及更早要求 pandas<3，与主依赖 pandas==3.1.0 冲突
    # OPS-6：4.x 要求 gradio>=6.8（与主依赖冲突），且仅支持 transformers 5.x；
    # 保持 3.x。transformers 4.x 的 3 条 CVE 在 .trivyignore 登记（详见该文件注释）
    "mineru[pipeline]>=3.2.0,<4",
]
ocr-paddle = [
    # paddleocr 3.x 不自动携带 paddle 框架，需显式声明
    "paddlepaddle>=3.0,<4 ; python_full_version < '3.13'",
    "paddleocr>=3.0,<4 ; python_full_version < '3.13'",
    # PP-StructureV3 需 paddlex[ocr] 附加依赖（scikit-learn / pypdfium2 等），
    # paddleocr 3.x 只带 paddlex 基础依赖
    "paddlex[ocr]>=3.0,<4 ; python_full_version < '3.13'",
]

[tool.uv]
package = false
# 见 dependencies 中 python-magic-bin 注释：Windows 上以 python-magic-bin
# 替代 python-magic（否则两者共存会文件冲突），非 Windows 平台保持原依赖。
override-dependencies = ["python-magic; sys_platform != 'win32'"]

# 镜像源配置：
# - 默认 index 用清华 PyPI 镜像（国内下载稳定）
# - torch 在 Linux 平台锁定 PyTorch 官方 CPU 源：
#   容器内无需 GPU（LLM 推理走宿主机 Ollama），CPU 版可避免拉取
#   torch + nvidia-* CUDA 全家桶（约 2.5GB），Windows/macOS 不受影响
[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

# =============================================================================
# pytest 测试配置
# =============================================================================
[tool.pytest.ini_options]
asyncio_mode = "auto"                          # 自动识别 async 测试函数
asyncio_default_fixture_loop_scope = "session" # 事件循环作用域为整个会话
markers = [
    "e2e: 端到端测试，需要外部服务（Ollama/Milvus/SearXNG/PostgreSQL）",
]

# =============================================================================
# 覆盖率阈值（专项 D2：单一事实来源，CI 只写 --cov 不再带 --cov-fail-under）
# =============================================================================
[tool.coverage.report]
# 专项 D2（2026-09-30）：fail_under 自 ci.yml 收敛至此。
# SEC-15（2026-10-27）：补测辅助 LLM/基础设施/实验与样本存储服务后实测 67.02%
# （1298 passed），阈值按「实测基线-2 点缓冲」上调至 65；SEC P3 新增 18 例后实测 67.17%（1316 passed）
# 上调必须单向上调、禁止回退（special-projects-2026-09.md §D2）
fail_under = 65

